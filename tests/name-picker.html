<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Name Picker tests</title><link rel="stylesheet" href="../shared/style.css"><link rel="stylesheet" href="../shared/random-tools.css"><link rel="stylesheet" href="../random-name-picker/style.css"></head><body class="utility-page"><main><h1>Name Picker tests</h1><p id="summary">Running…</p><ol id="tests"></ol><div id="fixture"><section class="utility-card" id="name-tool" aria-label="Random Name Picker tool">
<noscript>Enable JavaScript to pick names locally in your browser.</noscript>
<form id="name-form">
<label class="name-input" for="names">Names — one per line<textarea id="names" placeholder="Emma&#10;Noah&#10;Olivia&#10;Liam&#10;Sophia" spellcheck="false" autocomplete="off" aria-describedby="entered-count name-privacy"></textarea></label>
<p id="entered-count" class="utility-hint">0 names entered</p>
<p id="name-privacy" class="utility-hint">Your list stays in your browser. Names are not sent to a server or saved by this tool.</p>
<div class="name-options"><label for="pick-count">Number to pick:<select id="pick-count"><option>1</option><option>2</option><option>3</option><option>5</option></select></label><label class="utility-check"><input type="checkbox" id="remove-picked">Remove picked names</label></div>
<p id="remaining-count" class="utility-hint"></p>
<div class="utility-actions name-actions"><button class="btn-primary" id="pick-name" type="submit" disabled>Pick a Name</button><button id="reset-list" type="button">Reset List</button></div>
<div class="utility-stage" id="name-stage" aria-busy="false"><p id="result-label" class="utility-hint">Your next pick</p><ul id="name-results" class="utility-result name-results" aria-label="Selected names"></ul></div>
<div class="utility-actions name-actions"><button id="pick-again" type="button" hidden>Pick Again</button></div>
<p id="name-error" role="alert" class="utility-error"></p><p id="name-status" role="status" aria-live="polite" class="utility-status"></p>
</form></section></div></main><script src="../shared/random-tools.js"></script><script src="../random-name-picker/model.js"></script><script src="../random-name-picker/picker.js"></script><script src="name-picker.tests.js"></script></body></html>
