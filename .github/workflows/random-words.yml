name: Random Word Generator checks
on:
  pull_request:
    paths: ['random-word-generator/**', 'shared/random-tools.js', 'tests/random-words*', '.github/workflows/random-words.yml']
  push:
    branches: [main]
    paths: ['random-word-generator/**', 'shared/random-tools.js', 'tests/random-words*', '.github/workflows/random-words.yml']
permissions:
  contents: read
jobs:
  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/random-words-model.test.js tests/random-tools-model.test.js
      - run: node --check random-word-generator/generator.js
      - run: node --check tests/random-words.tests.js
