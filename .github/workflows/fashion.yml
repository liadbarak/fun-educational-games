name: Dress Up checks
on:
  pull_request:
    paths: ['dress-up-game/**', 'tests/fashion*', '.github/workflows/fashion.yml']
  push:
    branches: [main]
    paths: ['dress-up-game/**', 'tests/fashion*', '.github/workflows/fashion.yml']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fashion-model.test.js
      - run: node --check dress-up-game/game.js
      - run: node --check tests/fashion.tests.js
