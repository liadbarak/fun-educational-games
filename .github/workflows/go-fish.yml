name: Go Fish checks
on:
  pull_request:
    paths: ['go-fish/**', 'tests/go-fish*', '.github/workflows/go-fish.yml']
  push:
    branches: [main]
    paths: ['go-fish/**', 'tests/go-fish*', '.github/workflows/go-fish.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/go-fish.test.js
      - run: node --check go-fish/game.js
      - run: node --check tests/go-fish.tests.js
