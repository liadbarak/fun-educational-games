name: Dino Nestkeepers checks
on:
  pull_request:
    paths: ['dinosaur-matching-game/**', 'tests/dino*', '.github/workflows/dino-nestkeepers.yml']
  push:
    branches: [main]
    paths: ['dinosaur-matching-game/**', 'tests/dino*', '.github/workflows/dino-nestkeepers.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dino-model.test.js
      - run: node --check dinosaur-matching-game/game.js
      - run: node --check tests/dino.tests.js
