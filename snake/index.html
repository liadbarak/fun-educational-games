<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play Snake Online — Free Classic Arcade Game</title>
  <meta name="description" content="Play the classic Snake game free in your browser. No download, no signup — eat, grow, and practise planning ahead under pressure.">
  <link rel="canonical" href="https://liadbarak.github.io/fun-educational-games/snake/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Play Snake Online — Free Classic Arcade Game">
  <meta property="og:description" content="The classic Snake game, free in your browser. No download, no signup.">
  <meta property="og:url" content="https://liadbarak.github.io/fun-educational-games/snake/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="game-page">

<div id="game">
  <canvas id="board" width="400" height="400"></canvas>

  <div id="info">
    <span class="tag tag-logic">🧭 Planning &amp; Reaction</span>

    <h2>SCORE</h2>  <p id="score">0</p>
    <h2>LENGTH</h2> <p id="length">3</p>

    <button id="pause-btn" class="btn-block">⏸ Pause</button>
    <a class="btn-support" href="https://buymeacoffee.com/liadb" target="_blank" rel="noopener">☕ Buy me a coffee</a>

    <h2>CONTROLS</h2>
    <div id="dpad">
      <div class="dpad-row">
        <button class="ctrl-btn" data-control="up" title="Up">↑</button>
      </div>
      <div class="dpad-row">
        <button class="ctrl-btn" data-control="left"  title="Left">←</button>
        <button class="ctrl-btn" data-control="down"  title="Down">↓</button>
        <button class="ctrl-btn" data-control="right" title="Right">→</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared/shell.js"></script>
<script src="snake.js"></script>
<script>renderFooter('../');</script>
</body>
</html>
